[DATABASE]
host = localhost
port = 5432
database = tpcc_200
user = postgres
password = 123456
template_db = tpcc_200_template
target_db = tpcc_200
restart_cmd = sudo pg_ctlcluster 14 main restart
recover_script = /home/karimnazarovj/dbbert/scripts/recover_postgres.sh

[BENCHMARK]
type = oltp
benchmark = tpcc
benchbase_jar = /home/karimnazarovj/dbbert/benchbase/target/benchbase-postgres/benchbase.jar
workload_config = /home/karimnazarovj/dbbert/benchbase/target/benchbase-postgres/config/postgres/sample_tpcc_config.xml
reset_every = 1
